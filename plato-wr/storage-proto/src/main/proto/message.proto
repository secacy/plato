// IM存储系统不直接关注“多端推送”，但100%关注“多端状态同步”。这是由IM接入层/业务层来主导，存储层（我们）提供“原子能力”的结果。
// 是否要device_id？ 我建议在SendMessageRequest中增加一个可选字段 int64 sender_device_id = 6;
// 我们的storage-api不处理这个字段，只是透传并存入TiDB。 目的： 仅用于数据分析和问题排查（“这条消息是哪个设备发的？”）。

syntax = "proto3";

package com.plato.storage;

option java_package = "com.plato.storage";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// =================================================================
// 1. 消息服务 (Message Service)
// =================================================================

service StorageMessageService {
  // 发送消息
  rpc CreateMessages(CreateMessagesRequest) returns (CreateMessagesResponse);
  rpc CreateMessage(CreateMessageRequest) returns (CreateMessageResponse);

  // 查询消息列表（用于同步新消息、拉取历史记录）
  rpc QueryMessages(QueryMessagesRequest) returns (QueryMessagesResponse);

  // 更新消息状态(e.g., 撤回)
  rpc UpdateMessageState(UpdateMessageStateRequest) returns (UpdateMessageStateResponse);
}

// -------------------
// 核心数据模型 (Data Models)
// -------------------
message Message {
  uint64 msg_id = 1;         // 全局唯一ID
  uint64 session_id = 2;        // 会话 ID
  uint64 sender_id = 3;      // 发送者 User ID
  string client_message_id = 4;  // 客户端生成ID，仅用于幂等
  MessageType msg_type = 5; // 消息类型
  bytes body = 6;           // 消息体 (Protobuf 或 JSON 序列化后的二进制)
  MessageStatus status = 7;  // 消息状态
  google.protobuf.Timestamp send_time = 8; // 服务器收到消息的时间
}

// 消息类型枚举
enum MessageType {
  TEXT = 0;   // 文本
  IMAGE = 1;  // 图片
  VOICE = 2;  // 语音
  FILE = 3;   // 文件
  SYSTEM = 10; // 系统通知 (如: "A 邀请 B 加入群聊")
}

// 消息状态枚举
enum MessageStatus {
  // 默认值：消息正常、已发送
  SENT = 0;

  // 消息已被发送方撤回
  RECALLED = 1;

  // 消息已被删除 (例如管理员操作、或违反系统规则)
  DELETED = 2;

  // ... 其他可能的状态
}

// -------------------
// 1. CreateMessages (创建消息)
// -------------------

message CreateMessagesRequest {
  repeated Message message = 1;
}

message CreateMessagesResponse {
  // Key: client_message_id, Value: UserInfo
  map<string, MessageCreationResult> results = 1;
}

message MessageCreationResult {
  oneof result {
    SuccessfulCreation success = 2;
    FailedCreation failure = 3;
  }
}

message SuccessfulCreation {
  uint64 msg_id = 1;
  google.protobuf.Timestamp server_time = 2;
}

message FailedCreation {
  int32 error_code = 1;   // e.g., 1 = INVALID_CONTENT, 2 = SENDER_MUTED
  string error_message = 2;
}

message CreateMessageRequest {
  Message message = 1;
}

message CreateMessageResponse {
  // 成功时，返回服务器分配的ID和时间
  // 失败时，直接返回 gRPC 错误码（例如 ALREADY_EXISTS）
  uint64 msg_id = 1; // 服务器分配的ID
  google.protobuf.Timestamp server_time = 2;  // 服务器入库时间
}

// -------------------
// 2. QueryMessages (查询消息)
// -------------------

message QueryMessagesRequest {
  uint64 session_id = 1;        // 会话ID
  uint64 anchor_msg_id = 2;  // 锚点消息ID (比如从哪条消息开始向前/向后拉)(客户端本地已知的最新或最旧的 msg_id)
  Direction direction = 3;  // 拉取方向
  int32 limit = 4;          // 拉取条数
}

enum Direction {
  BEFORE = 0; // 拉取锚点之前的 (历史记录)
  AFTER = 1;  // 拉取锚点之后的 (增量同步)
}

message QueryMessagesResponse {
  repeated Message messages = 1; // 按 msg_id 排序
  bool has_more = 2;      // 提示客户端，这个方向是否还有更多数据
}

// -------------------
// 3. UpdateMessageState (更新状态)
// -------------------

message UpdateMessageStateRequest {
  // 业务层应负责鉴权 (e.g., 只有发送者才能撤回)
  uint64 conversation_id = 1;
  uint64 message_id = 2;      // 定位要更新的消息
  MessageStatus new_status = 3; // 目标状态 (e.g., RECALLED)
}

message UpdateMessageStateResponse {
  // 成功时返回空。
  // 失败时直接返回 gRPC 错误码
  // (e.g., NOT_FOUND, PERMISSION_DENIED)
}
