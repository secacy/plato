// Session: 会话的全局实体

syntax = "proto3";

package com.plato.storage;

option java_multiple_files = true;
option java_package = "com.plato.api.grpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

// =================================================================
// 会话实体服务 (Session Service)
//
// 职责：管理会话（群聊、频道）的全局、稳定信息。
// 【不】负责：成员列表、在线状态、用户个人会话状态。
// =================================================================


service StorageSessionService {
  // 1. 创建会话 (e.g., 创建群聊)
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // 2. 获取会话的稳定信息 (群名, 封面等)
  // (这是一个高频读操作, 应设计重缓存)
  rpc GetSessionInfo(GetSessionInfoRequest) returns (GetSessionInfoResponse);

  // 3. 批量获取会话信息
  rpc GetBatchSessionInfo(GetBatchSessionInfoRequest) returns (GetBatchSessionInfoResponse);

  // 4. 更新会话信息 (e.g., 改群名, 改封面)
  rpc UpdateSessionInfo(UpdateSessionInfoRequest) returns (UpdateSessionInfoResponse);
}


// -------------------
// 核心数据模型
// -------------------

// 会话（Session）的全局、稳定数据
message Session {
  // 会话ID
  uint64 session_id = 1;
  // 会话类型
  SessionType type = 2;
  // 会话名称
  string name = 3;
  // 会话封面图 URL
  string cover_image_url = 4;
  // 拥有者/创建者 ID
  uint64 owner_id = 5;
  // 创建时间
  google.protobuf.Timestamp create_time = 6;
  // 扩展字段 (e.g., 群公告, 群描述)
  map<string, string> extra = 7;
}

// 会话类型枚举
enum SessionType {
  UNKNOWN = 0;
  SINGLE = 1;  // 单聊
  GROUP = 2; // 群聊
  LIVE = 3; // 直播间
  CHANNEL = 4; // 频道
}

// -------------------
// 1. CreateSession
// -------------------
message CreateSessionRequest {
  string client_session_id = 1; // 客户端幂等ID
  SessionType type = 2;
  string name = 3;
  string cover_image_url = 4;
  uint64 owner_id = 5;
//  repeated uint64 initial_member_ids = 6; // 初始成员
  // (初始成员应由业务层调用 StorageMemberService.AddSessionMembers)
}

message CreateSessionResponse {
  Session session = 1; // 返回创建成功的会话
}

// -------------------
// 2. GetSessionInfo
// -------------------
message GetSessionInfoRequest {
  uint64 session_id = 1;
}

message GetSessionInfoResponse {
  Session session = 1;
}

// -------------------
// 3. GetBatchSessionInfo
// -------------------
message GetBatchSessionInfoRequest {
  repeated uint64 session_ids = 1;
}

message GetBatchSessionInfoResponse {
  // Key: session_id, Value: 对应的 Session
  map<uint64, Session> sessions = 1;
}

// -------------------
// 4. UpdateSessionInfo
// -------------------
message UpdateSessionInfoRequest {
  uint64 session_id = 1;
  string name = 2; // 要更新的名称
  string cover_image_url = 3; // 要更新的封面
  map<string, string> extra = 4; // 要更新的扩展字段

  // 必须使用 FieldMask 来指定要更新哪些字段
  // e.g., ["name", "extra.announcement"]
  google.protobuf.FieldMask update_mask = 5;
}

message UpdateSessionInfoResponse {
  Session updated_session = 1;
}











