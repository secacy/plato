syntax = "proto3";

package com.plato.storage;

option java_package = "com.plato.api.grpc";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

// =================================================================
// 9. 会话成员服务 (Member Service)
//
// 职责：
// 1. 维护 【用户】和【会话】之间的多对多关系 (Membership)。
// 2. 存储成员的角色、加入时间等信息。
// =================================================================

service StorageMemberService {
  // 1. 添加一个或多个成员到会话
  // (业务层在调用 StorageSessionService.CreateSession 后，
  //  应立即调用此接口添加初始成员)
  rpc AddSessionMembers(AddSessionMembersRequest) returns (AddSessionMembersResponse);

  // 2. 将一个或多个成员移出会话(主动退群或被踢)
  rpc RemoveSessionMembers(RemoveSessionMembersRequest) returns (RemoveSessionMembersResponse);

  // 3. 更新会话成员的信息 (e.g., 晋升/降级管理员, 改群名片)
  rpc UpdateSessionMember(UpdateSessionMemberRequest) returns (UpdateSessionMemberResponse);

  // 4. 获取会话的成员列表 (高频, 需分页, 需重缓存)
  rpc GetSessionMembers(GetSessionMembersRequest) returns (GetSessionMembersResponse);
}

// -------------------
// 核心数据模型
// -------------------

message SessionMember {
  uint64 user_id = 1;
  uint64 session_id = 2;
  MemberRole role = 3; // 成员角色
  google.protobuf.Timestamp join_time = 4; // 加入时间
  string alias_in_session = 5; // 在群内的昵称 (群名片)

  map<string, string> extra = 6; // 扩展字段 (e.g., 禁言截止时间)
}

enum MemberRole {
  ROLE_UNKNOWN = 0;
  ROLE_OWNER = 1;   // 群主
  ROLE_ADMIN = 2;   // 管理员
  ROLE_MEMBER = 3;  // 普通成员
}

// -------------------
// RPC 消息体
// -------------------

message AddSessionMembersRequest {
  uint64 session_id = 1;
  repeated SessionMember members_to_add = 2;
}
message AddSessionMembersResponse {
  // 可返回部分成功/失败
}

message RemoveSessionMembersRequest {
  uint64 session_id = 1;
  repeated uint64 user_ids_to_remove = 2;
}
message RemoveSessionMembersResponse {
  // ...
}

message UpdateSessionMemberRequest {
  uint64 session_id = 1;
  uint64 user_id = 2;
  MemberRole new_role = 3; // 示例：只允许更新角色
  google.protobuf.FieldMask update_mask = 4; // 或使用 field_mask
}
message UpdateSessionMemberResponse {
  SessionMember updated_member = 1;
}

message GetSessionMembersRequest {
  uint64 session_id = 1;
  int32 limit = 2;
  uint64 offset_user_id = 3; // Keyset 分页
}
message GetSessionMembersResponse {
  repeated SessionMember members = 1;
  bool has_more = 2;
}
