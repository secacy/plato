// Inbox: 用户的会话条目

syntax = "proto3";

package com.plato.storage;

option java_package = "com.plato.storage";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

// =================================================================
// 会话收件箱服务 (Inbox Service)
//
// 职责：
// 1. 维护 【用户】和【会话】之间的关系 (User's Inbox)。
// 2. 聚合来自 Counter Server (Redis) 的“未读数”。
// 3. 聚合来自 主DB (MySQL/TiDB) 的“稳定”会话数据。
//
// =================================================================

  service StorageInboxService {

  // 1. 拉取“我”的会话列表 (核心读取接口)
  rpc QueryInboxes(QueryInboxesRequest) returns (QueryInboxesResponse);

  // 2. 更新“我”对某个会话的读取进度 (发已读回执)
  rpc UpdateInboxReadCursor(UpdateInboxReadCursorRequest) returns (UpdateInboxReadCursorResponse);

  // 3. 更新“我”对某个会话的个人设置 (置顶, 免打扰)
  rpc UpdateInboxSettings(UpdateInboxSettingsRequest) returns (UpdateInboxSettingsResponse);
}

// -------------------
// 核心数据模型 (Data Models)
// -------------------

// 用户的会话（收件箱条目）
// 这是一个“聚合”模型，数据源自 DB 和 Redis
message Inbox {
  uint64 session_id = 1;

  // 1. 最新消息元数据 (来自 主DB)
  uint64 latest_message_id = 2;         // 最新消息的ID
  MessagePreview last_message_preview = 3; // 最新消息的预览
  google.protobuf.Timestamp update_time = 4; // 列表排序的依据 (通常是最新消息时间)

  // 2. 未读状态 (一个来自Redis, 一个来自DB)
  int32 unread_count = 5;       // 【易变】未读数 (来自 Counter Server - Redis)
  uint64 last_read_message_id = 6; // 【稳定】用户的已读游标 (来自 主DB)

  // 3. 用户个人设置 (来自 主DB)
  bool is_pinned = 7;     // 是否置顶
  bool is_muted = 8;      // 是否免打扰
}

// 消息预览
message MessagePreview {
  uint64 sender_id = 1;
  string content_snippet = 2; // 消息内容的摘要 e.g., "你好", "[图片]", "[语音]"
}

// -------------------
// 1. QueryInboxes (拉取列表)
// -------------------

message QueryInboxesRequest {
  uint64 user_id = 1; // 为“谁”拉取会话列表

  // Keyset Pagination
  int64 anchor_update_time_ns = 2;
  int32 limit = 3; // e.g., 50
}

message QueryInboxesResponse {
  repeated Inbox inboxes = 1;
  bool has_more = 2; // 提示客户端是否还有更多
}

// -------------------
// 2. UpdateConversationReadCursor (更新已读)
// -------------------

message UpdateInboxReadCursorRequest {
  uint64 user_id = 1;
  uint64 session_id = 2;
  uint64 last_read_message_id = 3; // 告诉服务器 "我已经读到这条message_id了"
}

message UpdateInboxReadCursorResponse {
  // 成功时返回空。
  // 失败时 (e.g., 数据库失败) 返回 gRPC 错误码。
}

// -------------------
// 3. UpdateInboxSettings (置顶/免打扰)
// -------------------

// 这是一个独立的消息体，只包含用户可设置的字段
message InboxSettings {
  bool is_pinned = 1;
  bool is_muted = 2;
}

message UpdateInboxSettingsRequest {
  uint64 user_id = 1;
  uint64 session_id = 2;
  InboxSettings settings = 3;
  google.protobuf.FieldMask update_mask = 4;
}

message UpdateInboxSettingsResponse {
  InboxSettings updated_settings = 1;
}