# ============================================================================
# Storage Consumer 配置文件
# 职责：异步处理消息事件（写扩散、缓存回写）
# ============================================================================
# 应用信息
server:
  port: 18080

spring:
  application:
    name: storage-consumer
  profiles:
    active: dev

  # Kafka Consumer 配置
  kafka:
    bootstrap-servers: ${server.host:localhost}:9092
    consumer:
      # Consumer Group ID - 每个 Job 使用不同的 Group
      # 这里使用默认 Group，具体 Job 在代码中指定
      group-id: storage-consumer-group
      # 反序列化器
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      # 自动提交偏移量
      enable-auto-commit: false
      # 手动提交模式
      auto-offset-reset: earliest
      # 每次拉取的最大记录数
      max-poll-records: 100
      # 心跳间隔
      heartbeat-interval-ms: 3000
      # Session 超时时间
      session-timeout-ms: 30000
    listener:
      # 确认模式：手动确认
      ack-mode: manual
      # 并发度
      concurrency: 3

  # TiDB 数据源配置 (用于查询 member 表)
  datasource:
    url: jdbc:mysql://${server.host:localhost}:4000/im_storage?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池配置（HikariCP）
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: ${server.host:localhost}
      port: 6379
      password: ${redis.password:}
      database: 0
      # 连接池配置
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# MyBatis 配置
mybatis:
  configuration:
    # 日志实现
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 下划线转驼峰
    map-underscore-to-camel-case: true
  # 实体类扫描路径
  type-aliases-package: com.plato.consumer.repository.entity

# 日志配置
logging:
  level:
    root: INFO
    com.plato.consumer: INFO
    com.plato.consumer.listener: DEBUG
    com.plato.consumer.service: DEBUG
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Consumer 业务配置
consumer:
  kafka:
    # 消息事件 Topic（由 TiCDC 推送）
    topic: MsgEvents
  redis:
    # 会话列表缓存的最大条数
    max-session-list-size: 200
    # 消息缓存的最大条数
    max-message-cache-size: 1000

