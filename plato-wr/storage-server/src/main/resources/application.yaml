# ============================================================================
# Storage Server 配置文件
# ============================================================================

# 应用信息
spring:
  application:
    name: storage-server
  profiles:
    active: dev

  # Kafka 配置
  kafka:
    bootstrap-servers: ${server.host}:9092
    producer:
      # 序列化器
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      # 确认级别：all = 等待所有副本确认（最高可靠性）
      acks: all
      # 重试次数
      retries: 3
      # 批量大小：16KB
      batch-size: 16384
      # 等待时间：10ms
      linger-ms: 10
      # 压缩类型
      compression-type: snappy

  # TiDB 数据源配置 (兼容 MySQL 协议)
  datasource:
    url: jdbc:mysql://${server.host}:4000/im_storage?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池配置（HikariCP）
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: ${server.host}
      port: 6379
      password: ${redis.password}
      database: 0
      # 连接池配置
      lettuce:
        pool:
          max-active: 100
          max-idle: 10
          min-idle: 5
          max-wait: -1ms

# MyBatis 配置
mybatis:
  configuration:
    # 日志实现
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 下划线转驼峰
    map-underscore-to-camel-case: true
  # 实体类扫描路径
  type-aliases-package: com.plato.storage.repository.entity
  # Mapper XML 位置
  mapper-locations: classpath*:mapper/**/*.xml
  # TypeHandler 扫描路径
  type-handlers-package: com.plato.storage.repository.typehandler

# gRPC 服务端配置
grpc:
  server:
    port: 9090
    # 最大消息大小：4MB
    max-inbound-message-size: 4194304
    # 最大Header大小：8KB
    max-inbound-metadata-size: 8192

# 日志配置
logging:
  level:
    root: ERROR
    com.plato.storage: ERROR
    com.plato.storage.grpc: ERROR
    com.plato.storage.service: ERROR
    com.plato.storage.producer: ERROR
    # SQL日志（开发环境开启）
    com.plato.storage.repository.mapper: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点（可选，用于监控）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 批处理配置（新架构）
storage:
  batch:
    # 容量阈值：多少条消息触发批处理
    capacity-threshold: 50
    # 时间阈值：多少毫秒触发批处理
    time-threshold-ms: 10
    # 定时扫描间隔
    scan-interval-ms: 5
    # 工作线程池核心线程数（默认 CPU 核心数）
    core-pool-size: 4
    # 工作线程池最大线程数（默认 CPU 核心数 * 2）
    max-pool-size: 8
    # 缓存消息列表的最大条数
    max-cached-messages: 1000
    # 消息索引缓存 TTL（天）
    message-cache-ttl-days: 3
    # 消息元数据缓存 TTL（天）
    message-meta-ttl-days: 1