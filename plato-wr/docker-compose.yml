services:
  # 1. 消息队列: Kafka (依赖 Zookeeper)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.3
    container_name: zookeeper
    networks:
      - im-storage-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.3
    container_name: kafka
    networks:
      - im-storage-net
    depends_on:
      - zookeeper
    ports:
      - "19092:9092"
      - "29092:29092" # 暴露给宿主机 (e.g., 本地调试)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 2. 数据库: TiDB (使用 Playground 镜像)
  # 这是一个单容器内的最小化 TiDB 集群，专为本地开发和测试设计。
  tidb:
    image: pingcap/tidb:latest
    container_name: tidb
    networks:
      - im-storage-net
    ports:
      - "4000:4000"  # TiDB SQL 端口
      - "21080:10080" # TiDB Dashboard
      - "2379:2379"  # PD 端口
    volumes:
      - tidb-data:/data

  # 3. 缓存: Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - im-storage-net
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # 4. 对象存储: MinIO
  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
      - im-storage-net
    ports:
      - "19000:9000"  # API 端口
      - "19001:9001"  # 控制台端口
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # 5. 搜索引擎: Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch
    networks:
      - im-storage-net
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # 关键：本地开发禁用安全认证
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # 限制内存，防止占用过多
    volumes:
      - es-data:/usr/share/elasticsearch/data

  # 6. 配置中心: Nacos
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: nacos
    networks:
      - im-storage-net
    environment:
      - MODE=standalone # 单机模式
      - PREFER_HOST_MODE=hostname
      - NACOS_AUTH_ENABLE=false # 禁用认证
    ports:
      - "18848:8848"
    volumes:
      - nacos-data:/home/nacos/data

  # 7. 可观测性 - PLEG (Prometheus, Loki, Grafana)
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    networks:
      - im-storage-net
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml # 官方推荐的本地启动方式

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    networks:
      - im-storage-net
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml # 挂载本地配置文件
    command: --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    networks:
      - im-storage-net
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

# 定义数据卷，用于持久化
volumes:
  tidb-data:
  redis-data:
  minio-data:
  es-data:
  nacos-data:
  grafana-data:

# 定义网络
networks:
  im-storage-net:
    driver: bridge