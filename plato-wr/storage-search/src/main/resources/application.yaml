# ============================================================================
# Storage Search Server 配置文件
# 职责：消息搜索服务（独立微服务，物理隔离）
# ============================================================================

# 应用信息
spring:
  application:
    name: storage-search
  profiles:
    active: dev

  # Elasticsearch 配置
  elasticsearch:
    uris: ${elasticsearch.host:http://localhost:9200}
    username: ${elasticsearch.username:}
    password: ${elasticsearch.password:}
    connection-timeout: 5s
    socket-timeout: 30s

  # Redis 配置（用于获取用户会话列表）
  data:
    redis:
      host: ${server.host:localhost}
      port: 6379
      password: ${redis.password:}
      database: 0
      # 连接池配置
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# gRPC 服务端配置
grpc:
  server:
#    port: 9092  # 独立端口，区别于 storage-server (9090)
    # 最大消息大小：4MB
    max-inbound-message-size: 4194304
    # 最大Header大小：8KB
    max-inbound-metadata-size: 8192
    # 线程池配置（重要：资源隔离）
    executor:
      # 核心线程数
      core-pool-size: 10
      # 最大线程数
      max-pool-size: 50
      # 队列容量
      queue-capacity: 200
      # 线程空闲时间
      keep-alive: 60s

# 日志配置
logging:
  level:
    root: INFO
    com.plato.search: INFO
    com.plato.search.grpc: DEBUG
    com.plato.search.service: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点（用于监控）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  server:
    port: 19091  # 监控端口

# 搜索配置
search:
  # 默认分页大小
  default-page-size: 20
  # 最大分页大小
  max-page-size: 100
  # 最大会话数量（全局搜索）
  max-sessions: 1000
  # 高亮配置
  highlight:
    pre-tag: "<em>"
    post-tag: "</em>"
    fragment-size: 150
    number-of-fragments: 1

